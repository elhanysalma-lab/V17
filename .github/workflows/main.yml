name: Noury 4-15 Min Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Studio Production (Long Video Generation)
        run: python agents/agent_supervisor.py

      - name: Upload Final 4-15 Min YouTube Video
        uses: actions/upload-artifact@v4
        with:
          name: noury-youtube-4minutes
          path: output_movies/
